<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" role="img" aria-labelledby="title desc">
  <title id="title">OpenBSD Mailstack architecture</title>
  <desc id="desc">A contextual architecture diagram showing network controls, mail transport, mailbox services, filtering, web access, state services, monitoring and recovery for the OpenBSD Mailstack.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#111b27"/><stop offset="1" stop-color="#070b10"/></linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#8fa4b4" stroke-opacity=".055"/></pattern>
  </defs>
  <rect width="960" height="560" rx="18" fill="url(#bg)"/><rect width="960" height="560" rx="18" fill="url(#grid)"/>
  <rect x="1" y="1" width="958" height="558" rx="17" fill="none" stroke="#4de1ff" stroke-opacity=".28"/>
  <text x="46" y="52" fill="#b6ff3b" font-family="monospace" font-size="14" font-weight="700" letter-spacing="2">OPENBSD MAILSTACK / REPRODUCIBLE SECURE INFRASTRUCTURE</text>
  <text x="46" y="78" fill="#8fa0ad" font-family="monospace" font-size="11" letter-spacing="1.4">OPENBSD 7.9 · POSTFIX · DOVECOT · RSPAMD · PF · WIREGUARD · RECOVERY</text>

  <g font-family="monospace">
    <rect x="50" y="132" width="166" height="116" rx="10" fill="#0b151f" stroke="#b6ff3b" stroke-opacity=".48"/>
    <text x="70" y="163" fill="#b6ff3b" font-size="11">NETWORK CONTROL</text><text x="70" y="195" fill="#eef4f8" font-size="15" font-weight="700">PF / WireGuard</text><text x="70" y="220" fill="#8495a2" font-size="10">DNS · TLS · bindings</text>

    <rect x="274" y="110" width="182" height="160" rx="10" fill="#0c1720" stroke="#4de1ff" stroke-opacity=".44"/>
    <text x="296" y="143" fill="#4de1ff" font-size="11">MAIL TRANSPORT</text><text x="296" y="178" fill="#eef4f8" font-size="16" font-weight="700">Postfix</text><text x="296" y="205" fill="#8495a2" font-size="10">SMTP · submission</text><text x="296" y="227" fill="#8495a2" font-size="10">policy · routing</text><text x="296" y="249" fill="#8495a2" font-size="10">staged validation</text>

    <rect x="506" y="110" width="182" height="160" rx="10" fill="#0c1720" stroke="#4de1ff" stroke-opacity=".44"/>
    <text x="528" y="143" fill="#4de1ff" font-size="11">MAILBOX SERVICE</text><text x="528" y="178" fill="#eef4f8" font-size="16" font-weight="700">Dovecot</text><text x="528" y="205" fill="#8495a2" font-size="10">IMAP · mailbox state</text><text x="528" y="227" fill="#8495a2" font-size="10">auth · delivery</text><text x="528" y="249" fill="#8495a2" font-size="10">operator checks</text>

    <rect x="738" y="132" width="170" height="116" rx="10" fill="#0b151f" stroke="#b6ff3b" stroke-opacity=".42"/>
    <text x="758" y="163" fill="#b6ff3b" font-size="11">FILTERING</text><text x="758" y="195" fill="#eef4f8" font-size="15" font-weight="700">Rspamd / ClamAV</text><text x="758" y="220" fill="#8495a2" font-size="10">Redis-backed state</text>
  </g>

  <g stroke="#4de1ff" stroke-opacity=".45" fill="none"><path d="M216 190h58"/><path d="M456 190h50"/><path d="M688 190h50"/></g>
  <g fill="#4de1ff"><path d="m268 186 8 4-8 4z"/><path d="m500 186 8 4-8 4z"/><path d="m732 186 8 4-8 4z"/></g>

  <g font-family="monospace">
    <rect x="88" y="334" width="194" height="116" rx="10" fill="#08121a" stroke="#90a2b1" stroke-opacity=".24"/>
    <text x="108" y="365" fill="#4de1ff" font-size="11">WEB / ADMIN</text><text x="108" y="398" fill="#eef4f8" font-size="14" font-weight="700">Roundcube</text><text x="108" y="421" fill="#8495a2" font-size="10">PostfixAdmin</text>

    <rect x="330" y="334" width="194" height="116" rx="10" fill="#08121a" stroke="#90a2b1" stroke-opacity=".24"/>
    <text x="350" y="365" fill="#4de1ff" font-size="11">STATE SERVICES</text><text x="350" y="398" fill="#eef4f8" font-size="14" font-weight="700">MariaDB / Redis</text><text x="350" y="421" fill="#8495a2" font-size="10">tracked config ≠ secrets</text>

    <rect x="572" y="334" width="194" height="116" rx="10" fill="#08121a" stroke="#90a2b1" stroke-opacity=".24"/>
    <text x="592" y="365" fill="#b6ff3b" font-size="11">OPERATIONS</text><text x="592" y="398" fill="#eef4f8" font-size="14" font-weight="700">Monitor / maintain</text><text x="592" y="421" fill="#8495a2" font-size="10">verify · regress · harden</text>

    <rect x="814" y="334" width="94" height="116" rx="10" fill="#08121a" stroke="#b6ff3b" stroke-opacity=".38"/>
    <text x="834" y="365" fill="#b6ff3b" font-size="11">DR</text><text x="834" y="398" fill="#eef4f8" font-size="13" font-weight="700">Backup</text><text x="834" y="421" fill="#8495a2" font-size="10">recover</text>
  </g>

  <path d="M596 270v38c0 14-12 26-26 26H185" fill="none" stroke="#4de1ff" stroke-opacity=".3"/><path d="M596 308h265v26" fill="none" stroke="#b6ff3b" stroke-opacity=".3"/>
  <text x="46" y="516" fill="#677986" font-family="monospace" font-size="10" letter-spacing="1.2">BUILD · RENDER · APPLY · VERIFY · MONITOR · BACK UP · RECOVER</text>
</svg>
