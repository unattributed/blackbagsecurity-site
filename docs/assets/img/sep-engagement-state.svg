<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" role="img" aria-labelledby="title desc">
  <title id="title">Security Engagement Platform engagement control plane</title>
  <desc id="desc">A contextual architecture diagram showing authority, executable scope, governed execution, evidence, reporting and retest as one continuous engagement state.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#111b27"/><stop offset="1" stop-color="#070b10"/></linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#8fa4b4" stroke-opacity=".06"/></pattern>
    <filter id="glow"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect width="960" height="560" rx="18" fill="url(#bg)"/>
  <rect width="960" height="560" rx="18" fill="url(#grid)"/>
  <rect x="1" y="1" width="958" height="558" rx="17" fill="none" stroke="#4de1ff" stroke-opacity=".28"/>
  <text x="46" y="52" fill="#b6ff3b" font-family="monospace" font-size="14" font-weight="700" letter-spacing="2">SECURITY ENGAGEMENT PLATFORM</text>
  <text x="46" y="78" fill="#8fa0ad" font-family="monospace" font-size="11" letter-spacing="1.4">AUTHORITATIVE ENGAGEMENT STATE / CONTROL PLANE</text>
  <g font-family="monospace">
    <rect x="46" y="122" width="162" height="94" rx="8" fill="#0d1721" stroke="#b6ff3b" stroke-opacity=".55"/>
    <text x="64" y="150" fill="#b6ff3b" font-size="11" letter-spacing="1">01 AUTHORITY</text>
    <text x="64" y="177" fill="#e7eef3" font-size="14" font-weight="700">Written approval</text>
    <text x="64" y="198" fill="#8797a4" font-size="11">operator · dates · stops</text>

    <rect x="236" y="122" width="162" height="94" rx="8" fill="#0d1721" stroke="#4de1ff" stroke-opacity=".45"/>
    <text x="254" y="150" fill="#4de1ff" font-size="11" letter-spacing="1">02 SCOPE</text>
    <text x="254" y="177" fill="#e7eef3" font-size="14" font-weight="700">Executable rules</text>
    <text x="254" y="198" fill="#8797a4" font-size="11">targets · actions · limits</text>

    <rect x="426" y="122" width="162" height="94" rx="8" fill="#0d1721" stroke="#4de1ff" stroke-opacity=".45"/>
    <text x="444" y="150" fill="#4de1ff" font-size="11" letter-spacing="1">03 EXECUTE</text>
    <text x="444" y="177" fill="#e7eef3" font-size="14" font-weight="700">Governed adapters</text>
    <text x="444" y="198" fill="#8797a4" font-size="11">browser · API · ZAP · WSTG</text>

    <rect x="616" y="122" width="138" height="94" rx="8" fill="#0d1721" stroke="#4de1ff" stroke-opacity=".45"/>
    <text x="634" y="150" fill="#4de1ff" font-size="11" letter-spacing="1">04 EVIDENCE</text>
    <text x="634" y="177" fill="#e7eef3" font-size="14" font-weight="700">Provenance</text>
    <text x="634" y="198" fill="#8797a4" font-size="11">artifacts · hashes</text>

    <rect x="782" y="122" width="132" height="94" rx="8" fill="#0d1721" stroke="#b6ff3b" stroke-opacity=".55"/>
    <text x="800" y="150" fill="#b6ff3b" font-size="11" letter-spacing="1">05 CLOSE</text>
    <text x="800" y="177" fill="#e7eef3" font-size="14" font-weight="700">Report / retest</text>
    <text x="800" y="198" fill="#8797a4" font-size="11">decision · closure</text>
  </g>
  <g stroke="#4de1ff" stroke-opacity=".5" fill="none">
    <path d="M208 169h28"/><path d="M398 169h28"/><path d="M588 169h28"/><path d="M754 169h28"/>
  </g>
  <g fill="#4de1ff"><path d="m232 165 8 4-8 4z"/><path d="m422 165 8 4-8 4z"/><path d="m612 165 8 4-8 4z"/><path d="m778 165 8 4-8 4z"/></g>

  <rect x="46" y="264" width="868" height="206" rx="10" fill="#08111a" fill-opacity=".78" stroke="#90a2b1" stroke-opacity=".14"/>
  <text x="68" y="295" fill="#8294a2" font-family="monospace" font-size="11" letter-spacing="1.4">LIVE ENGAGEMENT STATE</text>
  <g font-family="monospace" font-size="12">
    <text x="70" y="334" fill="#e4ebf0">engagement_id</text><text x="246" y="334" fill="#4de1ff">bbs-eng-716x</text>
    <text x="70" y="365" fill="#e4ebf0">authority</text><text x="246" y="365" fill="#b6ff3b">VALIDATED</text>
    <text x="70" y="396" fill="#e4ebf0">scope_state</text><text x="246" y="396" fill="#d3dce3">machine-checkable</text>
    <text x="70" y="427" fill="#e4ebf0">evidence_boundary</text><text x="246" y="427" fill="#d3dce3">private / report-safe</text>

    <text x="520" y="334" fill="#e4ebf0">coverage</text><text x="686" y="334" fill="#d3dce3">reconciled</text>
    <text x="520" y="365" fill="#e4ebf0">provenance</text><text x="686" y="365" fill="#b6ff3b">BOUND</text>
    <text x="520" y="396" fill="#e4ebf0">report_state</text><text x="686" y="396" fill="#d3dce3">evidence-backed</text>
    <text x="520" y="427" fill="#e4ebf0">retest</text><text x="686" y="427" fill="#4de1ff">READY</text>
  </g>
  <circle cx="888" cy="292" r="4" fill="#b6ff3b" filter="url(#glow)"/>
  <text x="46" y="516" fill="#677986" font-family="monospace" font-size="10" letter-spacing="1.2">AUTHORITY → SCOPE → OPERATION → EVIDENCE → REPORT → RETEST</text>
</svg>
