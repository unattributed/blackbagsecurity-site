<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" role="img" aria-labelledby="title desc">
  <title id="title">OSMAP secure mail access architecture</title>
  <desc id="desc">A contextual architecture diagram showing browser access through nginx into a Rust server-rendered web application, a narrow Unix socket helper boundary, Dovecot and Postfix, with safe rendering and bounded session controls.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#101a25"/><stop offset="1" stop-color="#070b10"/></linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#8fa4b4" stroke-opacity=".055"/></pattern>
  </defs>
  <rect width="960" height="560" rx="18" fill="url(#bg)"/><rect width="960" height="560" rx="18" fill="url(#grid)"/>
  <rect x="1" y="1" width="958" height="558" rx="17" fill="none" stroke="#4de1ff" stroke-opacity=".28"/>
  <text x="46" y="52" fill="#b6ff3b" font-family="monospace" font-size="14" font-weight="700" letter-spacing="2">OSMAP / OPENBSD SECURE MAIL ACCESS PLATFORM</text>
  <text x="46" y="78" fill="#8fa0ad" font-family="monospace" font-size="11" letter-spacing="1.4">RUST · SERVER RENDERED · NO RUNTIME JAVASCRIPT · LEAST PRIVILEGE</text>

  <g font-family="monospace">
    <rect x="54" y="142" width="148" height="100" rx="10" fill="#0b151f" stroke="#4de1ff" stroke-opacity=".42"/>
    <text x="74" y="172" fill="#4de1ff" font-size="11">BROWSER</text><text x="74" y="202" fill="#eef4f8" font-size="15" font-weight="700">User access</text><text x="74" y="224" fill="#8495a2" font-size="10">keyboard · responsive</text>

    <rect x="246" y="142" width="136" height="100" rx="10" fill="#0b151f" stroke="#4de1ff" stroke-opacity=".42"/>
    <text x="266" y="172" fill="#4de1ff" font-size="11">NGINX</text><text x="266" y="202" fill="#eef4f8" font-size="15" font-weight="700">TLS edge</text><text x="266" y="224" fill="#8495a2" font-size="10">host · origin controls</text>

    <rect x="426" y="116" width="204" height="152" rx="10" fill="#0c1720" stroke="#b6ff3b" stroke-opacity=".62"/>
    <text x="448" y="148" fill="#b6ff3b" font-size="11">RUST WEB PROCESS</text><text x="448" y="180" fill="#eef4f8" font-size="16" font-weight="700">Server-rendered OSMAP</text>
    <text x="448" y="207" fill="#8495a2" font-size="10">TOTP · CSRF · sessions</text><text x="448" y="229" fill="#8495a2" font-size="10">safe render · remote block</text><text x="448" y="251" fill="#8495a2" font-size="10">bounded workers · fail closed</text>

    <rect x="690" y="142" width="216" height="100" rx="10" fill="#0b151f" stroke="#b6ff3b" stroke-opacity=".4"/>
    <text x="712" y="172" fill="#b6ff3b" font-size="11">LOCAL HELPER</text><text x="712" y="202" fill="#eef4f8" font-size="15" font-weight="700">Narrow authority</text><text x="712" y="224" fill="#8495a2" font-size="10">permissioned Unix socket</text>
  </g>
  <g stroke="#4de1ff" stroke-opacity=".48" fill="none"><path d="M202 192h44"/><path d="M382 192h44"/><path d="M630 192h60"/></g>
  <g fill="#4de1ff"><path d="m240 188 8 4-8 4z"/><path d="m420 188 8 4-8 4z"/><path d="m684 188 8 4-8 4z"/></g>

  <rect x="246" y="332" width="278" height="126" rx="10" fill="#08121a" stroke="#90a2b1" stroke-opacity=".24"/>
  <text x="268" y="365" fill="#4de1ff" font-family="monospace" font-size="11">MAILBOX AUTHORITY</text>
  <text x="268" y="399" fill="#eef4f8" font-family="monospace" font-size="15" font-weight="700">Dovecot</text>
  <text x="268" y="427" fill="#8495a2" font-family="monospace" font-size="11">mailbox access remains authoritative</text>

  <rect x="570" y="332" width="278" height="126" rx="10" fill="#08121a" stroke="#90a2b1" stroke-opacity=".24"/>
  <text x="592" y="365" fill="#4de1ff" font-family="monospace" font-size="11">MESSAGE SUBMISSION</text>
  <text x="592" y="399" fill="#eef4f8" font-family="monospace" font-size="15" font-weight="700">Postfix</text>
  <text x="592" y="427" fill="#8495a2" font-family="monospace" font-size="11">transport remains outside web process</text>

  <path d="M798 242v46c0 22-18 40-40 40H385v4" fill="none" stroke="#b6ff3b" stroke-opacity=".38"/>
  <path d="M798 288v40h-89v4" fill="none" stroke="#b6ff3b" stroke-opacity=".38"/>
  <path d="m381 326 4 8 4-8zM705 326l4 8 4-8z" fill="#b6ff3b"/>

  <g font-family="monospace" font-size="10">
    <rect x="54" y="332" width="146" height="34" rx="17" fill="#b6ff3b" fill-opacity=".1" stroke="#b6ff3b" stroke-opacity=".25"/><text x="75" y="353" fill="#b6ff3b">SAFE RENDERING</text>
    <rect x="54" y="380" width="146" height="34" rx="17" fill="#4de1ff" fill-opacity=".08" stroke="#4de1ff" stroke-opacity=".22"/><text x="76" y="401" fill="#4de1ff">BOUNDED SESSION</text>
    <rect x="54" y="428" width="146" height="34" rx="17" fill="#4de1ff" fill-opacity=".08" stroke="#4de1ff" stroke-opacity=".22"/><text x="78" y="449" fill="#4de1ff">FAIL-CLOSED UX</text>
  </g>
  <text x="46" y="516" fill="#677986" font-family="monospace" font-size="10" letter-spacing="1.2">BROWSER ACCESS WITHOUT MOVING MAILBOX AUTHORITY INTO THE BROWSER-FACING PROCESS</text>
</svg>
