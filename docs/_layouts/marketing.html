<!doctype html>
<html lang="{{ page.lang | default: site.lang | default: 'en' }}">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <meta name="description" content="{{ page.description | default: site.description | strip | escape }}" />
  <meta name="msvalidate.01" content="1FE51893A5AC95D625ED3C04BA06D71C" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; object-src 'none'; frame-ancestors 'none'; form-action 'self'" />
  <meta name="theme-color" content="#0b0f14" />
  <link rel="canonical" href="{{ page.url | absolute_url }}" />

  <title>{{ page.title | default: site.title }}</title>
  <meta property="og:title" content="{{ page.title | default: site.title | escape }}" />
  <meta property="og:description" content="{{ page.description | default: site.description | strip | escape }}" />
  <meta property="og:type" content="website" />
  <meta property="og:url" content="{{ page.url | absolute_url }}" />
  <meta property="og:site_name" content="{{ site.title | escape }}" />
  <meta property="og:image" content="{{ '/assets/img/logo-bag.svg' | absolute_url }}" />
  <meta property="og:image:alt" content="Black Bag Security mark" />
  <meta name="twitter:card" content="summary" />
  <meta name="twitter:title" content="{{ page.title | default: site.title | escape }}" />
  <meta name="twitter:description" content="{{ page.description | default: site.description | strip | escape }}" />

  <link rel="preload" href="{{ '/assets/css/style.css' | relative_url }}" as="style" />
  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}" />
  <link rel="stylesheet" href="{{ '/assets/css/site.css' | relative_url }}" />
  <link rel="stylesheet" href="{{ '/assets/css/marketing.css' | relative_url }}" />
  <link rel="icon" href="{{ '/assets/img/logo-bag.svg' | relative_url }}" type="image/svg+xml" />
  <script type="application/ld+json" src="{{ '/assets/data/organization.json' | relative_url }}"></script>
  <script type="application/ld+json" src="{{ '/assets/data/website.json' | relative_url }}"></script>
</head>
<body class="marketing-site page-{{ page.ref | default: 'general' | slugify }}">
  <a class="skip" href="#content">Skip to content</a>

  <header class="marketing-header">
    <div class="marketing-wrap marketing-header__inner">
      <a class="marketing-brand" href="{{ '/' | relative_url }}" aria-label="Black Bag Security home">
        <img src="{{ '/assets/img/logo-bag.svg' | relative_url }}" width="42" height="42" alt="" />
        <span><strong>BLACK BAG</strong><small>SECURITY</small></span>
      </a>

      <nav class="marketing-nav" aria-label="Primary navigation">
        <a{% if page.url contains '/services/' %} class="is-active" aria-current="page"{% endif %} href="{{ '/services/' | relative_url }}">Services</a>
        <a{% if page.url contains '/methodology/' %} class="is-active" aria-current="page"{% endif %} href="{{ '/methodology/' | relative_url }}">Method</a>
        <a{% if page.url contains '/arsenal/' %} class="is-active" aria-current="page"{% endif %} href="{{ '/arsenal/' | relative_url }}">Proof</a>
        <a{% if page.url contains '/about/' %} class="is-active" aria-current="page"{% endif %} href="{{ '/about/' | relative_url }}">About</a>
        <a{% if page.url contains '/contact/' %} class="is-active" aria-current="page"{% endif %} href="{{ '/contact/' | relative_url }}">Contact</a>
      </nav>

      <a class="marketing-header__cta" href="{{ '/contact/#assessment' | relative_url }}">Discuss an engagement</a>
    </div>
  </header>

  <main id="content" class="marketing-main">
    {{ content }}
  </main>

  <footer class="marketing-footer">
    <div class="marketing-wrap marketing-footer__inner">
      <div>
        <strong>Black Bag Security</strong>
        <span>Security testing and engineering for high-consequence systems.</span>
      </div>
      <nav aria-label="Footer navigation">
        <a href="{{ '/services/' | relative_url }}">Services</a>
        <a href="{{ '/methodology/' | relative_url }}">Method</a>
        <a href="{{ '/arsenal/' | relative_url }}">Proof</a>
        <a href="{{ '/about/' | relative_url }}">About</a>
        <a href="{{ '/contact/' | relative_url }}">Contact</a>
        <a href="{{ '/security.txt' | relative_url }}">Security</a>
      </nav>
      <small>&copy; <span id="year"></span> Black Bag Security. All rights reserved.</small>
    </div>
  </footer>

  <script src="{{ '/assets/js/app.js' | relative_url }}" defer></script>
</body>
</html>
