name: proof hero fingerprint once

on:
  push:
    branches:
      - feature/proof-sales-v43
    paths:
      - .github/workflows/proof-hero-lock-setup-once.yml

permissions:
  contents: read

jobs:
  fingerprint-proof-hero:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Proof branch
        uses: actions/checkout@v4
        with:
          ref: feature/proof-sales-v43

      - name: Calculate approved Proof hero fingerprints
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          import re

          source = Path('docs/research.md').read_text(encoding='utf-8')
          match = re.search(r'  <section class="proof43-hero".*?</section>', source, flags=re.S)
          if not match:
              raise SystemExit('Proof hero section not found')
          hero = (match.group(0) + '\n').encode('utf-8')
          css = Path('docs/assets/css/bbs-proof-aotp-ux-v44.css').read_bytes()
          print('PROOF_HERO_SHA256=' + hashlib.sha256(hero).hexdigest())
          print('PROOF_HERO_CSS_SHA256=' + hashlib.sha256(css).hexdigest())
          PY
