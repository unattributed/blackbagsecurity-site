name: method immutable production lock

on:
  push:
    branches:
      - main
      - redesign/v2
      - 'feature/**'
  pull_request:
    branches:
      - main
      - redesign/v2

permissions:
  contents: read

jobs:
  verify-method-lock:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify immutable Method baseline
        shell: bash
        run: |
          set -euo pipefail

          verify_blob() {
            local path="$1"
            local expected="$2"
            local actual

            if [[ ! -f "$path" ]]; then
              echo "FAIL: locked Method file is missing: $path"
              return 1
            fi

            actual="$(git hash-object "$path")"
            if [[ "$actual" != "$expected" ]]; then
              echo "FAIL: immutable Method baseline drift detected"
              echo "path=$path"
              echo "expected=$expected"
              echo "actual=$actual"
              echo "The Method page is production approved. Explicitly reopen Method review before changing it."
              return 1
            fi

            echo "PASS: $path"
          }

          # Complete approved Method page content and markup.
          verify_blob "docs/methodology.md" "656631cfdbef1825653e39654c4142276e617a09"

          # Approved Method visual layers and loader.
          verify_blob "docs/assets/css/bbs-method-sales-v41.css" "59c17d1684f3403fc4d9b75288b267b5a0e62dee"
          verify_blob "docs/assets/css/bbs-method-client-visibility-v42.css" "8a34f78217a828f08d1e56913687b749b3b62d67"
          verify_blob "docs/assets/css/methodology-section-labels-v20.css" "cd016675bf74649c6a715d8e89e5aa15d2169409"

          # Shared icon assets that materially affect the approved Method render.
          verify_blob "docs/assets/img/icon-scope.svg" "c60b145c36ad6976153691db3f78a02c57a5f1c0"
          verify_blob "docs/assets/img/icon-lifecycle.svg" "10200ca61e376f2e7d2cdf2ed0c9c923e4364d99"
          verify_blob "docs/assets/img/icon-evidence.svg" "347f6971854d32070e954b514220ac88309d30ae"
          verify_blob "docs/assets/img/icon-shield.svg" "6a3d691efedbb69b870f312bed945c52e33d2c84"
          verify_blob "docs/assets/img/icon-principles.svg" "7f84771340e880460f39cd3053f0a0e2c23af779"
          verify_blob "docs/assets/img/icon-chip.svg" "98e43fef2f73456fb5bbf1b7ecb1c66d6cc26e93"
          verify_blob "docs/assets/img/icon-target.svg" "89d4cc03bf761bc4159004f877486e8b95cb726b"
          verify_blob "docs/assets/img/icon-flask.svg" "4d21e38a3a04be82f97e3296b42cfeae7f29a9bd"
          verify_blob "docs/assets/img/icon-transparency.svg" "2e4dad4c4c735d751edfdbddea259f92a9e4e927"
          verify_blob "docs/assets/img/icon-deliverables.svg" "24760f2a752c7abcf6706cdc79ed6ce482b269da"
          verify_blob "docs/assets/img/proof-code-automation-v35.svg" "b2cf87a36335f07ceee0d5a2eb9b7c46fc88b56d"

          # Approved lifecycle illustrations used across Method.
          verify_blob "docs/assets/img/lifecycle-authorize-v33.svg" "0365a4a43666e28b3a66afe7fee20adcd6d695f6"
          verify_blob "docs/assets/img/lifecycle-test-v33.svg" "6cffad47e5b7cecec2da333fe1c811290759c475"
          verify_blob "docs/assets/img/lifecycle-evidence-v33.svg" "85ea6e2808e929dadaba25d6fff91c7db7aa6410"
          verify_blob "docs/assets/img/lifecycle-report-v33.svg" "664790d981850eb12605d226e3a79e36464abb5f"
          verify_blob "docs/assets/img/lifecycle-remediate-v33.svg" "8539d564126ee7acf33fc9451dc0c84a692788f1"
          verify_blob "docs/assets/img/lifecycle-retest-v33.svg" "d88167f466de455f017a9da3efbe9f663bef074d"

          # Approved protected client-data handling illustrations.
          verify_blob "docs/assets/img/data-collect-v34.svg" "e978ef015821d29eecca78e22f96d6f5003e4e3f"
          verify_blob "docs/assets/img/data-preserve-v34.svg" "e600b46336775aad324a699ba9f04f509fa105c4"
          verify_blob "docs/assets/img/data-sanitize-v34.svg" "23626a54956006e2c4c78d25e66244c9a5df5864"
          verify_blob "docs/assets/img/data-deliver-v34.svg" "41b58ff39edcb409a1ceb8f3afc5bb789d844a7c"

          # The shared layout may continue evolving for other pages, but Method's
          # approved loader must remain enabled for methodology pages.
          python3 - <<'PY'
          from pathlib import Path
          import sys

          layout = Path("docs/_layouts/home-v2.html").read_text(encoding="utf-8")
          loader = Path("docs/assets/css/methodology-section-labels-v20.css").read_text(encoding="utf-8")

          if "methodology-section-labels-v20.css" not in layout:
              print("FAIL: locked Method stylesheet loader is no longer loaded by home-v2.html")
              sys.exit(1)
          print("PASS: layout includes Method stylesheet loader")

          required_imports = [
              "bbs-method-sales-v41.css",
              "bbs-method-client-visibility-v42.css",
          ]
          for stylesheet in required_imports:
              if stylesheet not in loader:
                  print(f"FAIL: locked Method stylesheet import is missing: {stylesheet}")
                  sys.exit(1)
              print(f"PASS: Method loader imports {stylesheet}")

          print("PASS: complete production-approved Method baseline is intact")
          PY
