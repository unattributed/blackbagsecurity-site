name: add services hero fit once

on:
  push:
    branches:
      - feature/sitewide-main-continuity-v54
    paths:
      - .github/workflows/add-services-hero-fit-once.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout redesign branch
        uses: actions/checkout@v4
        with:
          ref: feature/sitewide-main-continuity-v54
          fetch-depth: 0

      - name: Add Services hero fit stylesheet
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('docs/_layouts/home-v2.html')
          s = p.read_text(encoding='utf-8')
          old = "  {% if page.ref == 'services' %}<link rel=\"stylesheet\" href=\"{{ '/assets/css/bbs-services-marketing-v55.css' | relative_url }}\" />{% endif %}\n"
          new = old + "  {% if page.ref == 'services' %}<link rel=\"stylesheet\" href=\"{{ '/assets/css/bbs-services-hero-fit-v56.css' | relative_url }}\" />{% endif %}\n"
          if old not in s:
              raise SystemExit('v55 services stylesheet loader not found')
          if 'bbs-services-hero-fit-v56.css' in s:
              raise SystemExit('v56 services stylesheet already loaded')
          p.write_text(s.replace(old, new, 1), encoding='utf-8')
          PY

      - name: Commit loader
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/_layouts/home-v2.html
          git commit -m 'load services hero fit'
          git push origin HEAD:feature/sitewide-main-continuity-v54
