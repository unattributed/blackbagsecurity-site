name: proof aotp architecture markup once

on:
  push:
    branches:
      - feature/proof-sales-v43
    paths:
      - .github/workflows/proof-aotp-markup-once.yml

permissions:
  contents: write

jobs:
  update-aotp-markup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Proof branch
        uses: actions/checkout@v4
        with:
          ref: feature/proof-sales-v43
          fetch-depth: 0

      - name: Replace AOTP graphic markup
        shell: bash
        env:
          OLD_B64: 
          NEW_B64: 
        run: |
          set -euo pipefail
          python3 -c "import base64,os; from pathlib import Path; p=Path('docs/research.md'); s=p.read_text(); old=base64.b64decode(os.environ['OLD_B64']).decode(); new=base64.b64decode(os.environ['NEW_B64']).decode(); assert s.count(old)==1, f'old graphic matches={s.count(old)}'; p.write_text(s.replace(old,new,1))"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/research.md
          git commit -m 'redesign proof aotp architecture graphic'
          git push origin HEAD:feature/proof-sales-v43
