name: verify services v57 bundle once

on:
  push:
    branches:
      - feature/sitewide-main-continuity-v54
    paths:
      - .github/workflows/verify-services-v57-bundle-once.yml

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout redesign branch
        uses: actions/checkout@v4
        with:
          ref: feature/sitewide-main-continuity-v54
          fetch-depth: 0

      - name: Verify staged bundle
        shell: bash
        run: |
          set -euo pipefail
          echo '=== staged parts ==='
          find .services-v57-bundle -maxdepth 1 -type f -name 'part*.b64' -printf '%f %s\n' | sort -V
          echo '=== concatenate ==='
          find .services-v57-bundle -maxdepth 1 -type f -name 'part*.b64' -print0 | sort -zV | xargs -0 cat > /tmp/services-v57.b64
          wc -c /tmp/services-v57.b64
          echo '=== decode ==='
          base64 -d /tmp/services-v57.b64 > /tmp/services-v57.tar.gz
          sha256sum /tmp/services-v57.tar.gz
          file /tmp/services-v57.tar.gz
          echo '=== tar contents ==='
          tar -tzvf /tmp/services-v57.tar.gz
