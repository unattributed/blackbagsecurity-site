name: homepage-refinement-once

'on':
  push:
    branches: [feature/sitewide-main-continuity-v54]
    paths: [.github/workflows/homepage-refinement-once.yml]

permissions:
  contents: write

jobs:
  refine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/sitewide-main-continuity-v54
          fetch-depth: 0
      - shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path
          import re

          p = Path('docs/index.html')
          s = p.read_text(encoding='utf-8')

          old = '''        <div class="v24-copy-points">
          <div class="v24-copy-point"><span class="v24-copy-point__icon">★</span><span>Founder-led. Policy-driven. Process enforced.</span></div>
          <div class="v24-copy-point"><span class="v24-copy-point__icon">✓</span><span>Uniform delivery. Consistent standards. Reviewable outcomes.</span></div>
        </div>'''
          new = '''        <p>Founder-led. Policy-driven. Process enforced.</p>
        <div class="v24-actions"><a class="v24-btn v24-btn--accent" href="/about/">About Black Bag Security →</a></div>'''
          if old not in s:
              raise SystemExit('institutional block missing')
          s = s.replace(old, new, 1)

          a = s.find('  <section class="v24-section" aria-labelledby="focused-services">')
          b = s.find('  <section class="v24-section" aria-labelledby="same-rigor">', a)
          if a < 0 or b < 0:
              raise SystemExit('focused services boundaries missing')
          s = s[:a] + s[b:]

          s = s.replace('class="v24-btn" href="/methodology/"', 'class="v24-btn v24-btn--accent" href="/methodology/"', 1)
          s = s.replace('class="v24-btn" href="/trust/">See the trust model →', 'class="v24-btn v24-btn--accent" href="/methodology/#client-protection">See client protection →', 1)
          s = s.replace('The Arsenal shows the engineering depth behind the work without exposing client engagements.', 'Proof shows the engineering depth behind the work without exposing client engagements.', 1)
          s = s.replace('View the Engineering Arsenal →', 'View Proof →', 1)

          for href in ('/arsenal/aotp/','/arsenal/security-engagement-platform/','/arsenal/osmap/','/arsenal/browser-safe-ai-security/'):
              old_link = f'<a href="{href}">Inspect →</a>'
              new_link = f'<a class="v24-btn v24-btn--accent" href="{href}">Inspect →</a>'
              if old_link not in s:
                  raise SystemExit('missing proof link ' + href)
              s = s.replace(old_link, new_link, 1)

          for token in ('Focused services.','Measurable impact.','Uniform delivery. Consistent standards. Reviewable outcomes.','View the Engineering Arsenal','The Arsenal shows'):
              if token in s:
                  raise SystemExit('forbidden content remains: ' + token)

          anchors = re.findall(r'<a\b[^>]*>', s)
          bad = [x for x in anchors if 'v24-btn v24-btn--accent' not in x]
          if bad:
              raise SystemExit('nonstandard MAIN link remains: ' + ' | '.join(bad))

          p.write_text(s, encoding='utf-8')
          PY
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add docs/index.html
          git commit -m 'refine main conversion flow'
          git push origin HEAD:feature/sitewide-main-continuity-v54
