name: proof sep standard once

on:
  push:
    branches:
      - feature/proof-sales-v43
    paths:
      - .github/workflows/proof-sep-standard-once.yml

permissions:
  contents: write

jobs:
  update-sep:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Proof branch
        uses: actions/checkout@v4
        with:
          ref: feature/proof-sales-v43
          fetch-depth: 0

      - name: Replace SEP section and load visual
        shell: bash
        env:
          OLD_B64: 
          NEW_B64: 
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64, os
          from pathlib import Path
          p = Path('docs/research.md')
          s = p.read_text()
          old = base64.b64decode(os.environ['OLD_B64']).decode()
          new = base64.b64decode(os.environ['NEW_B64']).decode()
          assert s.count(old) == 1, f'old SEP section matches={s.count(old)}'
          p.write_text(s.replace(old, new, 1))

          css = Path('docs/assets/css/arsenal-v2.css')
          c = css.read_text()
          marker = "@import url('/assets/css/bbs-proof-aotp-marketing-v50.css');"
          addition = marker + "\n@import url('/assets/css/bbs-proof-sep-standard-v51.css');"
          if "bbs-proof-sep-standard-v51.css" not in c:
              assert marker in c
              css.write_text(c.replace(marker, addition, 1))
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/research.md docs/assets/css/arsenal-v2.css
          git commit -m 'redesign proof sep delivery standard'
          git push origin HEAD:feature/proof-sales-v43
