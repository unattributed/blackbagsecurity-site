name: proof content edit once

on:
  push:
    branches:
      - feature/proof-sales-v43
    paths:
      - .github/workflows/proof-content-edit-once.yml

permissions:
  contents: write

jobs:
  edit-proof-content:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Proof branch
        uses: actions/checkout@v4
        with:
          ref: feature/proof-sales-v43
          fetch-depth: 0

      - name: Apply approved Proof content changes
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('docs/research.md')
          text = path.read_text(encoding='utf-8')

          old_aotp = 'AI powered, human governed, evidence first security testing.'
          new_aotp = 'Local AI keeps assessment context local. Human operators govern execution, evidence, and what becomes a finding.'
          if old_aotp not in text:
              raise SystemExit('expected AOTP support line not found')
          text = text.replace(old_aotp, new_aotp, 1)

          start_marker = '  <section class="proof43-section" aria-labelledby="why-build-title">'
          end_marker = '  <section class="proof43-section proof43-section--dark" id="proof-work"'
          start = text.find(start_marker)
          end = text.find(end_marker, start + 1)
          if start < 0 or end < 0 or end <= start:
              raise SystemExit('expected Why we build section boundaries not found')
          text = text[:start] + text[end:]

          approved_hero = 'When standard tooling falls short, we build the capability to turn uncertainty into proof.'
          if approved_hero not in text:
              raise SystemExit('approved Proof hero subtitle is not intact')

          path.write_text(text, encoding='utf-8')
          PY

          rm .github/workflows/proof-content-edit-once.yml

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/research.md .github/workflows/proof-content-edit-once.yml
          git commit -m 'refine proof aotp positioning'
          git push origin HEAD:feature/proof-sales-v43
