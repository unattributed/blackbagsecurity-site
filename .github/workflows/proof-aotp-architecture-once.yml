name: proof aotp architecture graphic once

on:
  push:
    branches:
      - feature/proof-sales-v43
    paths:
      - .github/workflows/proof-aotp-architecture-once.yml

permissions:
  contents: write

jobs:
  update-aotp-architecture:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Proof branch
        uses: actions/checkout@v4
        with:
          ref: feature/proof-sales-v43
          fetch-depth: 0

      - name: Build repository-grounded AOTP architecture graphic
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          from pathlib import Path

          path = Path('docs/research.md')
          source = path.read_text(encoding='utf-8')
          old = '''<div class="proof43-visual"><div class="proof43-visual__topline"><span>Governed offensive testing</span><strong>AI proposes. Authority controls.</strong></div><div class="proof43-project-visual"><img src="{{ '/assets/img/aotp-governed-loop.svg' | relative_url }}" alt="AOTP governed offensive testing architecture"></div><div class="proof43-project-outcome">Evidence decides what becomes a finding</div></div>'''
          new = '''<div class="proof43-visual proof49-aotp-visual">
        <div class="proof43-visual__topline"><span>Local confidential execution</span><strong>Private by architecture</strong></div>
        <div class="proof49-aotp-map" role="img" aria-label="AOTP architecture showing local campaign context and local AI, deterministic campaign authority, governed native tool execution to authorized targets, immutable evidence, replay validation, and human-reviewed findings">
          <div class="proof49-local-boundary">
            <div class="proof49-boundary-head"><span>Local trusted workstation</span><b>Client + campaign context stays local</b></div>

            <div class="proof49-primary-flow">
              <div class="proof49-stage proof49-stage--private">
                <small>01 · Private context</small>
                <strong>Local intelligence</strong>
                <div class="proof49-chipset"><span>Campaign state</span><span>Encrypted vault</span><span>Local Ollama model</span></div>
                <em>AI plans with bounded context</em>
              </div>
              <div class="proof49-arrow"><span>propose</span><b>→</b></div>
              <div class="proof49-stage proof49-stage--authority">
                <small>02 · Authority</small>
                <strong>Deterministic control plane</strong>
                <div class="proof49-chipset"><span>Scope + ROE</span><span>Budgets + stop conditions</span><span>Risk + approvals</span></div>
                <em>Permit or deny every action</em>
              </div>
              <div class="proof49-arrow"><span>authorize</span><b>→</b></div>
              <div class="proof49-stage proof49-stage--execution">
                <small>03 · Execution</small>
                <strong>Governed native tools</strong>
                <div class="proof49-chipset proof49-chipset--tools"><span>Browser</span><span>HTTP / TLS</span><span>Scanner</span><span>Parrot tools</span></div>
                <em>Only authorized calls execute</em>
              </div>
            </div>

            <div class="proof49-execution-drop"><span>captured after side effect</span><b>↓</b></div>

            <div class="proof49-evidence-flow">
              <div class="proof49-result proof49-result--evidence"><small>04 · Evidence</small><strong>Immutable evidence</strong><span>Raw outputs · SHA-256 · provenance</span></div>
              <div class="proof49-arrow proof49-arrow--compact"><b>→</b></div>
              <div class="proof49-result proof49-result--verify"><small>05 · Verify</small><strong>Replay + validation</strong><span>Reproduce · compare · reject unsupported</span></div>
              <div class="proof49-arrow proof49-arrow--compact"><b>→</b></div>
              <div class="proof49-result proof49-result--human"><small>06 · Human decision</small><strong>Evidence-backed finding</strong><span>Review · report · retest</span></div>
            </div>
          </div>

          <div class="proof49-target-path">
            <span>Governed test traffic</span>
            <div class="proof49-target-line"><b>→</b></div>
            <div class="proof49-target-node"><small>Authorized target</small><strong>Active scope only</strong><em>Rules of engagement enforced</em></div>
          </div>
        </div>
        <div class="proof49-principles"><span><b>AI</b> proposes</span><span><b>Policy</b> grants authority</span><span><b>Evidence</b> earns the finding</span></div>
      </div>'''
          if source.count(old) != 1:
              raise SystemExit(f'expected exactly one old AOTP graphic, found {source.count(old)}')
          path.write_text(source.replace(old, new, 1), encoding='utf-8')

          loader = Path('docs/assets/css/arsenal-v2.css')
          css = loader.read_text(encoding='utf-8')
          marker = "@import url('/assets/css/bbs-proof-aotp-ux-v44.css');\n"
          addition = marker + "@import url('/assets/css/bbs-proof-aotp-architecture-v49.css');\n"
          if "bbs-proof-aotp-architecture-v49.css" not in css:
              if marker not in css:
                  raise SystemExit('Proof CSS loader marker missing')
              loader.write_text(css.replace(marker, addition, 1), encoding='utf-8')
          PY

          cat > docs/assets/css/bbs-proof-aotp-architecture-v49.css <<'EOF'
          /* Proof AOTP architecture v49
           * Repository-grounded explainer for local privacy, deterministic authority,
           * governed execution, evidence validation, and human-reviewed outcomes.
           */

          .page-ref-arsenal .proof49-aotp-visual { min-height: 0; }

          .page-ref-arsenal .proof49-aotp-map {
            position: relative;
            z-index: 2;
            display: grid;
            grid-template-columns: minmax(0,1fr) 126px;
            gap: 14px;
            min-height: 430px;
            padding: 18px 18px 12px;
          }

          .page-ref-arsenal .proof49-local-boundary {
            position: relative;
            min-width: 0;
            padding: 42px 14px 14px;
            border: 1px solid rgba(37,214,239,.46);
            border-radius: 10px;
            background: linear-gradient(180deg,rgba(5,22,32,.94),rgba(2,13,21,.96));
            box-shadow: inset 0 0 30px rgba(37,214,239,.025);
          }

          .page-ref-arsenal .proof49-local-boundary::after {
            content: "";
            position: absolute;
            inset: 6px;
            pointer-events: none;
            border: 1px dashed rgba(37,214,239,.08);
            border-radius: 7px;
          }

          .page-ref-arsenal .proof49-boundary-head {
            position: absolute;
            z-index: 2;
            top: 0;
            left: 0;
            right: 0;
            display: flex;
            justify-content: space-between;
            gap: 12px;
            align-items: center;
            min-height: 34px;
            padding: 0 12px;
            border-bottom: 1px solid rgba(37,214,239,.14);
            color: #62deef;
            font-size: 7px;
            font-weight: 850;
            letter-spacing: .12em;
            text-transform: uppercase;
          }

          .page-ref-arsenal .proof49-boundary-head b {
            color: #b9ef68;
            font-size: 7px;
            letter-spacing: .08em;
          }

          .page-ref-arsenal .proof49-primary-flow {
            position: relative;
            z-index: 2;
            display: grid;
            grid-template-columns: minmax(0,1fr) 34px minmax(0,1.08fr) 34px minmax(0,1fr);
            gap: 7px;
            align-items: stretch;
          }

          .page-ref-arsenal .proof49-stage {
            display: flex;
            flex-direction: column;
            min-width: 0;
            min-height: 182px;
            padding: 13px 12px 11px;
            border: 1px solid rgba(74,155,180,.32);
            border-radius: 8px;
            background: rgba(3,14,22,.88);
          }

          .page-ref-arsenal .proof49-stage--private { border-color: rgba(37,214,239,.4); }
          .page-ref-arsenal .proof49-stage--authority {
            border-color: rgba(157,244,0,.5);
            box-shadow: 0 0 26px rgba(157,244,0,.035);
          }
          .page-ref-arsenal .proof49-stage--execution { border-color: rgba(37,214,239,.4); }

          .page-ref-arsenal .proof49-stage small,
          .page-ref-arsenal .proof49-result small,
          .page-ref-arsenal .proof49-target-node small {
            color: #62d8e9;
            font-size: 7px;
            font-weight: 850;
            letter-spacing: .12em;
            text-transform: uppercase;
          }

          .page-ref-arsenal .proof49-stage--authority small,
          .page-ref-arsenal .proof49-result--human small { color: #b5ec64; }

          .page-ref-arsenal .proof49-stage > strong {
            margin-top: 7px;
            color: #f1f6f4;
            font-size: 12px;
            line-height: 1.15;
          }

          .page-ref-arsenal .proof49-chipset {
            display: flex;
            flex-wrap: wrap;
            gap: 5px;
            margin-top: 12px;
          }

          .page-ref-arsenal .proof49-chipset span {
            padding: 5px 6px;
            border: 1px solid rgba(74,155,180,.22);
            border-radius: 4px;
            color: #9fc4c8;
            background: rgba(7,25,35,.8);
            font-size: 6.5px;
            font-weight: 750;
            line-height: 1.1;
          }

          .page-ref-arsenal .proof49-stage--authority .proof49-chipset span {
            border-color: rgba(157,244,0,.2);
            color: #badf7a;
          }

          .page-ref-arsenal .proof49-chipset--tools span { flex: 1 1 40%; text-align: center; }

          .page-ref-arsenal .proof49-stage em {
            margin-top: auto;
            padding-top: 10px;
            color: #778f96;
            font-size: 6.5px;
            font-style: normal;
            font-weight: 800;
            letter-spacing: .05em;
            text-transform: uppercase;
          }

          .page-ref-arsenal .proof49-stage--private em { color: #6fcbd8; }
          .page-ref-arsenal .proof49-stage--authority em { color: #b4dc77; }

          .page-ref-arsenal .proof49-arrow {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-width: 0;
            color: #4ed6e9;
            text-align: center;
          }

          .page-ref-arsenal .proof49-arrow span {
            margin-bottom: 3px;
            color: #6f969e;
            font-size: 5.5px;
            font-weight: 850;
            letter-spacing: .08em;
            text-transform: uppercase;
          }

          .page-ref-arsenal .proof49-arrow b { font-size: 18px; font-weight: 400; }

          .page-ref-arsenal .proof49-execution-drop {
            position: relative;
            z-index: 2;
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 31%;
            margin: 5px 0 5px auto;
            color: #4ed6e9;
          }

          .page-ref-arsenal .proof49-execution-drop span {
            color: #607f87;
            font-size: 5.5px;
            font-weight: 850;
            letter-spacing: .06em;
            text-transform: uppercase;
          }

          .page-ref-arsenal .proof49-execution-drop b { margin-top: -2px; font-size: 17px; font-weight: 400; }

          .page-ref-arsenal .proof49-evidence-flow {
            position: relative;
            z-index: 2;
            display: grid;
            grid-template-columns: minmax(0,1fr) 25px minmax(0,1fr) 25px minmax(0,1fr);
            gap: 7px;
            align-items: stretch;
          }

          .page-ref-arsenal .proof49-result {
            min-width: 0;
            min-height: 92px;
            padding: 11px 10px;
            border: 1px solid rgba(74,155,180,.28);
            border-radius: 7px;
            background: rgba(3,15,23,.82);
          }

          .page-ref-arsenal .proof49-result--human { border-color: rgba(157,244,0,.42); }

          .page-ref-arsenal .proof49-result strong {
            display: block;
            margin-top: 6px;
            color: #edf4f2;
            font-size: 9px;
          }

          .page-ref-arsenal .proof49-result span {
            display: block;
            margin-top: 7px;
            color: #789198;
            font-size: 6px;
            line-height: 1.35;
          }

          .page-ref-arsenal .proof49-arrow--compact span { display: none; }
          .page-ref-arsenal .proof49-arrow--compact b { font-size: 14px; }

          .page-ref-arsenal .proof49-target-path {
            position: relative;
            z-index: 2;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: stretch;
            min-width: 0;
            padding-top: 54px;
          }

          .page-ref-arsenal .proof49-target-path > span {
            color: #6e969d;
            font-size: 6px;
            font-weight: 850;
            letter-spacing: .08em;
            text-align: center;
            text-transform: uppercase;
          }

          .page-ref-arsenal .proof49-target-line {
            display: flex;
            align-items: center;
            margin: 10px 0;
            color: #4ed6e9;
          }

          .page-ref-arsenal .proof49-target-line::before {
            content: "";
            flex: 1;
            border-top: 1px dashed rgba(37,214,239,.45);
          }

          .page-ref-arsenal .proof49-target-line b { margin-left: -1px; font-size: 16px; font-weight: 400; }

          .page-ref-arsenal .proof49-target-node {
            padding: 14px 9px;
            border: 1px solid rgba(37,214,239,.38);
            border-radius: 8px;
            background: rgba(4,18,27,.94);
            text-align: center;
          }

          .page-ref-arsenal .proof49-target-node strong {
            display: block;
            margin-top: 7px;
            color: #f0f5f3;
            font-size: 9px;
          }

          .page-ref-arsenal .proof49-target-node em {
            display: block;
            margin-top: 7px;
            color: #718a90;
            font-size: 6px;
            font-style: normal;
            line-height: 1.3;
          }

          .page-ref-arsenal .proof49-principles {
            position: relative;
            z-index: 2;
            display: grid;
            grid-template-columns: repeat(3,minmax(0,1fr));
            margin: 0 18px 18px;
            overflow: hidden;
            border: 1px solid rgba(74,155,180,.24);
            border-radius: 7px;
            background: rgba(2,12,19,.72);
          }

          .page-ref-arsenal .proof49-principles span {
            padding: 11px 8px;
            color: #819ba0;
            font-size: 7px;
            font-weight: 800;
            letter-spacing: .08em;
            text-align: center;
            text-transform: uppercase;
          }

          .page-ref-arsenal .proof49-principles span + span { border-left: 1px solid rgba(74,155,180,.16); }
          .page-ref-arsenal .proof49-principles b { color: #9df400; font-weight: 900; }

          @media (max-width: 1180px) {
            .page-ref-arsenal .proof49-aotp-map { grid-template-columns: minmax(0,1fr) 108px; gap: 10px; padding-inline: 14px; }
            .page-ref-arsenal .proof49-primary-flow { grid-template-columns: minmax(0,1fr) 25px minmax(0,1.05fr) 25px minmax(0,1fr); gap: 5px; }
            .page-ref-arsenal .proof49-stage { padding-inline: 9px; }
          }

          @media (max-width: 980px) {
            .page-ref-arsenal .proof49-aotp-map { grid-template-columns: 1fr; }
            .page-ref-arsenal .proof49-target-path { display: grid; grid-template-columns: 1fr 60px 150px; align-items: center; gap: 8px; padding: 0 8px 6px; }
            .page-ref-arsenal .proof49-target-line { margin: 0; }
          }

          @media (max-width: 700px) {
            .page-ref-arsenal .proof49-primary-flow,
            .page-ref-arsenal .proof49-evidence-flow { grid-template-columns: 1fr; }
            .page-ref-arsenal .proof49-arrow { min-height: 24px; transform: rotate(90deg); }
            .page-ref-arsenal .proof49-arrow span { display: none; }
            .page-ref-arsenal .proof49-stage { min-height: 0; }
            .page-ref-arsenal .proof49-execution-drop { width: 100%; margin: 3px 0; }
            .page-ref-arsenal .proof49-boundary-head { position: relative; flex-direction: column; align-items: flex-start; padding: 9px 10px; }
            .page-ref-arsenal .proof49-local-boundary { padding-top: 14px; }
            .page-ref-arsenal .proof49-target-path { grid-template-columns: 1fr; text-align: center; }
            .page-ref-arsenal .proof49-target-line { justify-content: center; }
            .page-ref-arsenal .proof49-target-line::before { max-width: 90px; }
            .page-ref-arsenal .proof49-principles { grid-template-columns: 1fr; }
            .page-ref-arsenal .proof49-principles span + span { border-left: 0; border-top: 1px solid rgba(74,155,180,.16); }
          }
          EOF

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/research.md docs/assets/css/arsenal-v2.css docs/assets/css/bbs-proof-aotp-architecture-v49.css
          git commit -m 'redesign proof aotp architecture graphic'
          git push origin HEAD:feature/proof-sales-v43
