name: proof sep refine once

on:
  push:
    branches:
      - feature/proof-sales-v43
    paths:
      - .github/workflows/proof-sep-refine-once.yml

permissions:
  contents: write

jobs:
  refine-sep:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Proof branch
        uses: actions/checkout@v4
        with:
          ref: feature/proof-sales-v43
          fetch-depth: 0

      - name: Refine SEP copy, layout and marketing visual
        shell: bash
        env:
          OLD_B64: 
          NEW_B64: 
        run: |
          python3 - <<'PY'
          import base64
          from pathlib import Path

          path = Path('docs/research.md')
          text = path.read_text()
          old = base64.b64decode(Path('/dev/stdin').read_bytes()) if False else base64.b64decode(__import__('os').environ['OLD_B64']).decode()
          new = base64.b64decode(__import__('os').environ['NEW_B64']).decode()
          if old not in text:
              raise SystemExit('SEP section source not found exactly once')
          if text.count(old) != 1:
              raise SystemExit(f'expected one SEP section, found {text.count(old)}')
          path.write_text(text.replace(old, new, 1))

          css = Path('docs/assets/css/arsenal-v2.css')
          css_text = css.read_text()
          old_import = "@import url('/assets/css/bbs-proof-sep-standard-v51.css');"
          new_import = "@import url('/assets/css/bbs-proof-sep-standard-v52.css');"
          if old_import not in css_text:
              raise SystemExit('SEP v51 loader import not found')
          css.write_text(css_text.replace(old_import, new_import, 1))
          PY

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/research.md docs/assets/css/arsenal-v2.css
          git commit -m 'refine proof sep delivery marketing'
          git push origin HEAD:feature/proof-sales-v43
