name: homepage lock

on:
  push:
    branches:
      - main
      - feature/competitive-design-review
      - feature/homepage-practice-control-graphic
      - feature/client-acquisition-visual-redesign
  pull_request:
    branches:
      - main
      - feature/competitive-design-review
      - feature/homepage-practice-control-graphic
      - feature/client-acquisition-visual-redesign

permissions:
  contents: read

jobs:
  verify-homepage-lock:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify approved homepage baseline
        shell: bash
        run: |
          set -euo pipefail

          verify_blob() {
            local path="$1"
            local expected="$2"
            local actual

            if [[ ! -f "$path" ]]; then
              echo "FAIL: locked homepage file is missing: $path"
              return 1
            fi

            actual="$(git hash-object "$path")"
            if [[ "$actual" != "$expected" ]]; then
              echo "FAIL: homepage lock drift detected"
              echo "path=$path"
              echo "expected=$expected"
              echo "actual=$actual"
              echo "The homepage is approved and locked. Reopen homepage review explicitly before changing this baseline."
              return 1
            fi

            echo "PASS: $path"
          }

          verify_blob "docs/index.html" "50f8ddebbaa191fed6ae3bd22b9747307e7f65be"
          verify_blob "docs/_layouts/home-v2.html" "e52154b8928c62a9cb442eed24c3c5ef2b2605ce"
          verify_blob "docs/assets/css/homepage-v2.css" "212b41c3620e61d4faff97199085919429a4e89c"
          verify_blob "docs/assets/css/homepage-v2-polish.css" "067a8eaf77d4cc34ec639b7d5c092ebc7e07a965"
          verify_blob "docs/assets/css/homepage-v2-depth.css" "98ddf5556de5b9b99cfbe1845817c80599fa07a2"
          verify_blob "docs/assets/css/homepage-v2-silhouette.css" "341017eb4578fe0a71fd1c67460f03bb23391ce3"
          verify_blob "docs/assets/css/homepage-v2-refine.css" "3509dfb88814d7f798b1ab7501f7944be7e179de"
          verify_blob "docs/assets/css/bbs-winning-v10.css" "be0fe1d22ac8f82727f54b3a3e14278b904aa372"
          verify_blob "docs/assets/css/bbs-homepage-refinement-v12.css" "5b24acaa496abddbaecd6b7c0f7a8695ca66f89d"
          verify_blob "docs/assets/css/bbs-homepage-proof-v16.css" "35d00f15007329d1e117579fd8df19fe05cb4989"
          verify_blob "docs/assets/css/bbs-homepage-practice-v21.css" "03f5fad6c5508190d9229e55a64a456a501e3036"
          verify_blob "docs/assets/css/bbs-client-acquisition-v22.css" "fb0504fc3bc8f232aae4e70860cc32e1c6971aca"
          verify_blob "docs/assets/css/bbs-visual-story-v23.css" "50c8e8fcbf44c154f162c0a3b658e97520140e1f"
          verify_blob "docs/assets/css/bbs-infographic-site-v24.css" "b48354b84da260ce505bae0f277206346d8e770b"
          verify_blob "docs/assets/css/bbs-homepage-journey-v25.css" "165df6a7fb319490ed920a17d34b8b080f2f2287"
          verify_blob "docs/assets/js/app.js" "c01a2ac6743114bb4ca384be43c165efb66d977a"

          echo "PASS: approved homepage baseline is intact"
