name: proof hero immutable lock

on:
  push:
    branches:
      - main
      - redesign/v2
      - 'feature/**'
  pull_request:
    branches:
      - main
      - redesign/v2

permissions:
  contents: read

jobs:
  verify-proof-hero-lock:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify approved Proof hero
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          import re
          import sys

          expected_hero = '6c78626348e6cd0deb05455b78e57a5a94f38176d9489d66af25c4fb656130f0'
          expected_css = '38dd2c745d5175a6b65198c0ccbbbf1d0facc8cfe55f7bef1e6cf587cbd3211b'

          source = Path('docs/research.md').read_text(encoding='utf-8')
          match = re.search(r'  <section class="proof43-hero".*?</section>', source, flags=re.S)
          if not match:
              print('FAIL: Proof hero section is missing')
              sys.exit(1)

          hero = (match.group(0) + '\n').encode('utf-8')
          hero_sha = hashlib.sha256(hero).hexdigest()
          if hero_sha != expected_hero:
              print('FAIL: approved Proof hero markup drift detected')
              print(f'expected={expected_hero}')
              print(f'actual={hero_sha}')
              print('Explicitly reopen the Proof hero before changing it.')
              sys.exit(1)
          print('PASS: approved Proof hero markup is intact')

          css = Path('docs/assets/css/bbs-proof-aotp-ux-v44.css').read_bytes()
          css_sha = hashlib.sha256(css).hexdigest()
          if css_sha != expected_css:
              print('FAIL: approved Proof hero dashboard styling drift detected')
              print(f'expected={expected_css}')
              print(f'actual={css_sha}')
              print('Explicitly reopen the Proof hero before changing it.')
              sys.exit(1)
          print('PASS: approved Proof hero dashboard styling is intact')

          loader = Path('docs/assets/css/arsenal-v2.css').read_text(encoding='utf-8')
          if "bbs-proof-aotp-ux-v44.css" not in loader:
              print('FAIL: approved Proof hero stylesheet is no longer loaded')
              sys.exit(1)
          print('PASS: Proof hero stylesheet loader is intact')
          PY
